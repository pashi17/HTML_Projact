    <link rel="stylesheet" href='https://unpkg.com/boxicon@2.1.4/css/boxicons.min.css' rel="style">
    <style>
        #container{
            background-color: aqua;
            box-shadow: 10px 10px 30px black;
            display: flex;
            height: 285px;
            width: 30%;
            border-radius: 10px;
            margin-top: 120px;
            margin-left: 450px;
        }
        #sidebar{
            height: 100%;
            width: 60px;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
            border-radius: 8px 0 0 8px;
            border-right: none;
            background-color: yellowgreen;
            transition:width .75s ease-in-out;
        }
        #sidebar:hover{
            width: 170px;
        }
        ul{
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            row-gap: 1rem;
        }
        li{
           padding: 8px 5px;
           padding-left: 8px;
           border-radius: 10px;
           box-shadow: 4px 4px  8px white ;
           width: 110px;                
           cursor: pointer;       
           transition: background-color 0.1s ease;   
        }
        span{
             color: black;           
        }
        li:hover{
             box-shadow: 5px 5px 10px rgb(242, 156, 156);
             border: .10px solid;
             background-color: rgb(227, 241, 198);
        }
        .nav-link{
            display: inline-flex;
            column-gap: .5rem;
            color: inherit;
            text-decoration: none;
        }
        .item-txt{
            padding-left: 30px;
        }
        .attribute{
            position:absolute;
            bottom: 10px;
        }
        #container2{
            width: 300px;
            height: 37%;
            margin-left: 158px;           
            position: fixed;
        }
        h2{
            font-size: 40px;
            margin-top: 50px;
            
        }
        h2>span{
            position: relative;
            display: inline-block;
            margin-top: 20px;
            font-size: 50px;
            height: 50px;
            color: red;
            vertical-align: bottom;
            overflow: hidden;
        }
        h2>span>span{
            display: block;
            animation: anim 5s infinite ease;
        }
        @keyframes anim{
            0%{
                transform:  translateY(0%);
            }
            25%{
                transform: translateY(-100%);
            }
            50%{
                transform: translateY(-200%);
            }
            75%{
                transform: translateY(-300%);
            }
            100%{
                transform: translateY(-400%);
            }
        }
    </style>
</head>
