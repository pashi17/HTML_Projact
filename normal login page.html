        ul{
           display: flex;
           position: absolute;
           top: 60%;
           left: 25.5%;
           transform: translate(-50%, -50%);
           background-color: beige;
        }
        ul li{
             list-style-type: none;
        }
        ul li a{
            width: 50px;
            height: 50px;
            background-color: beige;
            text-align: center;
            line-height: 50px;
            font-size: 35px;
            margin: 0 10px;
            display: block;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 5px solid rgb(255, 255, 255);
            box-shadow: 12px 12px 10px rgb(111, 110, 110);
            z-index: 1;
        }
        ul li a .icon{
            color: white;
            transform: rotatey(360deg);
        }
        ul li a::before{
            content: --;
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: red;
            transition: .5s;
            z-index: 2;
        }
        ul li a:hover{
            top: 0;
            background-color: aqua;
            transition: .5s ease;
           
        }
        ul li:nth-child(1) a::before{
            background-color: rgb(89, 89, 245);
        }
        ul li:nth-child(2) a::before{
            background-color: pink;
        }
        ul li:nth-child(3) a::before{
            background-color: rgb(64, 243, 243);
        }
        ul li:nth-child(4) a::before{
            background-color: rgb(247, 255, 85);
        }

    <script>
        function username() {
            var un = document.getElementById("u");
            var gm = document.getElementById("m");
            var pw = document.getElementById("p");

            if (username_validation(un)) {
                if (gm_validation(gm)) {
                    if (password_validation(pw, 6, 8)) {
                        alert("Form Successfully Submitted");
                        window.location.reload();
                        return true;
                    }
                }
            }

            return false;
        }

        function username_validation(un) {
            var pattern = /^[a-zA-Z0-9_]+$/;
            if (un.value.match(pattern)) {
                return true;
            } else {
                alert('Username must contain only letters, numbers, or underscores.');
                un.focus();
                return false;
            }
        }

        function gm_validation(gmail) {
            var pattern = /^\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+$/;
            if (gmail.value.match(pattern)) {
                return true;
            } else {
                alert("You have entered an invalid Gmail address!");
                gmail.focus();
                return false;
            }
        }

        function password_validation(pass, min, max) {
            var len = pass.value.length;
            if (len === 0 || len < min || len > max) {
                alert("Password must be between " + min + " and " + max + " characters.");
                pass.focus();
                return false;
            }
            return true;
        }


            

    </script>
